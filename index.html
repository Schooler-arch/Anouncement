<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <title>School Announcement</title>
  <style>
    body {
      background-color: #1a1a1a;
      color: #ff6600;
      font-family: 'Arial Black', Gadget, sans-serif;
      text-align: center;
      padding: 50px;
      margin: 0;
      height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
    }
    .container {
      border: 5px dashed #ff6600;
      padding: 40px;
      border-radius: 15px;
      background-color: #0d0d0d;
      display: inline-block;
      min-width: 400px;
    }
    h1 {
      font-size: 4rem;
      text-shadow: 3px 3px #000, 0 0 20px #ff6600;
      margin: 0 0 20px 0;
    }
    p {
      color: #ffffff;
      font-size: 1.5rem;
      font-family: 'Arial', sans-serif;
    }
    .signature {
      font-size: 1.1rem;
      color: #ff8533;
      font-style: italic;
      font-family: 'Comic Sans MS', 'Arial', sans-serif;
      margin-top: 15px;
    }
    .emoji {
      font-size: 5rem;
    }
    .instruction {
      color: #888888;
      font-size: 1rem;
      font-family: sans-serif;
      margin-top: 25px;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="emoji">🎃 👻 🦇</div>
    <h1>HAPPY HALLOWEEN!</h1>
    <p>Have a spooktacular day at school today!</p>
    <p>Stay safe trick-or-treating! 🍬</p>
    <p class="signature">- Sent from You-Know-Who 🧙‍♂️✨</p>
    <div class="instruction">(Please close this tab to return to work)</div>
  </div>
</body>
</html>
